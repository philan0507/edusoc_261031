<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 비밀번호 만들기</title>
  <style>
    body { font-family: "Malgun Gothic", system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #3b2f4a; background: #fff6fa; line-height: 1.6; }
    input, button { font: inherit; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #fbd0e2; width: 100%; box-sizing: border-box; margin: 6px 0 12px; }
    button { background: #8b63d1; color: #fff; border: 0; font-weight: 700; cursor: pointer; }
    pre { background: #fff; border: 1px solid #fbd0e2; border-radius: 12px; padding: 14px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>🔑 관리자 비밀번호 만들기</h1>
  <p>비밀번호를 입력하면 <b>config.js</b>의 <code>admin</code> 항목에 붙여넣을 값이 만들어집니다. 입력한 비밀번호는 어디에도 전송·저장되지 않습니다.</p>
  <label for="pw">새 비밀번호 (8자 이상)</label>
  <input id="pw" type="password" autocomplete="new-password">
  <button id="go" type="button">값 만들기</button>
  <pre id="out" hidden></pre>
  <script src="sha256.js"></script>
  <script>
    document.getElementById("go").addEventListener("click", function () {
      var pw = document.getElementById("pw").value, out = document.getElementById("out");
      out.hidden = false;
      if (pw.length < 8) { out.textContent = "비밀번호는 8자 이상이어야 합니다."; return; }
      var a = new Uint8Array(6), salt = "";
      crypto.getRandomValues(a);
      for (var i = 0; i < a.length; i++) salt += ("0" + a[i].toString(16)).slice(-2);
      out.textContent = '  admin: {\n    salt: "' + salt + '",\n    passwordHash: "' + eduHash(pw, salt) + '"\n  },';
    });
  </script>
</body>
</html>
